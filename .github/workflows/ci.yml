name: Verify runtime lineage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: canary_test
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: canary_lineage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canary_test -d canary_lineage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run demo:distributed
      - run: npm run check:regression
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://canary_test:ci-only-not-a-secret@127.0.0.1:5432/canary_lineage_test
      - uses: actions/checkout@v4
        with:
          repository: typicode/json-server
          ref: 78ea71375666d49145734689c097654c54f90686
          path: .local/json-server
          persist-credentials: false
      - run: npm install --ignore-scripts --omit=dev --no-audit --no-fund
        working-directory: .local/json-server
      - run: node examples/external/json-server.js .local/json-server
      - run: npm pack --dry-run --ignore-scripts
